buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 29
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Opt in with -Psplatkit.useMavenLocal=true to run the example against a
// `publishToMavenLocal` build of the engine, for developing the two repositories
// together. It is off by default on purpose: a local build silently outranking
// the published artifact makes the example pass against an engine nobody else
// has, which is a hard failure to see and an easy one to ship.
if (project.hasProperty("splatkit.useMavenLocal")) {
    allprojects {
        repositories {
            // Gradle resolves a transitive dependency with the consuming
            // project's repositories, not the library's, so the app needs this
            // and not just the library module.
            mavenLocal()
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
