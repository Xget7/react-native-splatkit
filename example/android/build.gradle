buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 29
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        // Gradle resolves a transitive dependency with the consuming project's
        // repositories, not the library's, so the app needs this too. It lets the
        // example run against a `publishToMavenLocal` build of the engine, which
        // is how the two repositories are developed together.
        mavenLocal()
    }
}

apply plugin: "com.facebook.react.rootproject"
