name: Publish
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Node for npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check
        run: yarn lint && yarn typecheck && yarn test

      - name: Version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "$VERSION" || { echo "tag $TAG does not match package.json $VERSION"; exit 1; }

      - name: Publish
        run: npm publish --provenance --access public --tag "$( [[ "$GITHUB_REF_NAME" == *-* ]] && echo alpha || echo latest )"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
